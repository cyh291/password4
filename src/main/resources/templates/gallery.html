<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #0f172a;
            padding: 30px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            color: #f1f5f9;
            font-size: 28px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 small {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }
        .header .actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-admin {
            padding: 8px 20px;
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 60px;
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-admin:hover {
            background: rgba(129, 140, 248, 0.25);
        }
        .btn-logout {
            padding: 8px 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 60px;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 24px;
            margin-top: 30px;
        }
        .image-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
        }
        .image-card:hover {
            transform: translateY(-4px);
            border-color: rgba(129, 140, 248, 0.3);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }
        .image-card .img-wrapper {
            aspect-ratio: 1 / 1;
            background: #1e293b;
            overflow: hidden;
        }
        .image-card .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .image-card .card-footer {
            padding: 14px 18px;
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .empty {
            color: #475569;
            text-align: center;
            padding: 60px 20px;
            font-size: 16px;
        }
        .empty span {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>
                🖼️ 图片展示
                <small th:text="'共 ' + ${images.size()} + ' 张'"></small>
            </h1>
            <div class="actions">
                <a href="/admin" class="btn-admin">⚙️ 管理图片</a>
                <a href="/logout" class="btn-logout">🚪 退出</a>
            </div>
        </div>

        <div class="gallery-grid" th:if="${images != null && !images.isEmpty()}">
            <div class="image-card" th:each="img : ${images}">
                <div class="img-wrapper">
                    <img th:src="'/images/' + ${img}" th:alt="${img}">
                </div>
                <div class="card-footer" th:text="${img}"></div>
            </div>
        </div>

        <div class="empty" th:if="${images == null || images.isEmpty()}">
            <span>📭</span>
            暂无图片，管理员请去后台添加
        </div>

    </div>
</body>
</html>
