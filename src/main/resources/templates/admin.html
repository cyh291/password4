<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #0f172a;
            padding: 30px 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            color: #f1f5f9;
            font-size: 28px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 small {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }
        .header .actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn-back {
            padding: 8px 20px;
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 60px;
            background: rgba(129, 140, 248, 0.15);
            color: #a5b4fc;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-back:hover {
            background: rgba(129, 140, 248, 0.25);
        }
        .btn-logout {
            padding: 8px 20px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 60px;
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .upload-section {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 24px 28px;
            margin: 24px 0 32px;
            border: 2px dashed rgba(255, 255, 255, 0.08);
        }
        .upload-section h3 {
            color: #f1f5f9;
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 14px;
        }
        .upload-section form {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .upload-section input[type="file"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
            font-size: 14px;
            cursor: pointer;
            min-width: 180px;
        }
        .upload-section input[type="file"]::file-selector-button {
            padding: 6px 18px;
            border: none;
            border-radius: 30px;
            background: #818cf8;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            margin-right: 12px;
        }
        .btn-upload {
            padding: 12px 32px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, #34d399, #10b981);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-upload:hover {
            transform: scale(1.03);
        }

        .msg-success {
            color: #34d399;
            font-size: 14px;
            margin-top: 12px;
        }
        .msg-error {
            color: #f87171;
            font-size: 14px;
            margin-top: 12px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 10px;
        }
        .image-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
        }
        .image-card .img-wrapper {
            aspect-ratio: 1 / 1;
            background: #1e293b;
            overflow: hidden;
        }
        .image-card .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .image-card .card-footer {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .image-card .card-footer .filename {
            color: #94a3b8;
            font-size: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .image-card .card-footer .btn-delete {
            padding: 4px 14px;
            border: none;
            border-radius: 30px;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
            margin-left: 8px;
        }
        .image-card .card-footer .btn-delete:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        .empty {
            color: #475569;
            text-align: center;
            padding: 40px 20px;
            font-size: 15px;
        }
        .empty span {
            font-size: 40px;
            display: block;
            margin-bottom: 10px;
        }

        .tip {
            color: #64748b;
            font-size: 13px;
            margin-top: 20px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border-left: 3px solid #818cf8;
        }
        .tip code {
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            color: #a5b4fc;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>
                ⚙️ 图片管理
                <small th:text="'共 ' + ${images.size()} + ' 张'"></small>
            </h1>
            <div class="actions">
                <a href="/gallery" class="btn-back">⬅️ 返回展示</a>
                <a href="/logout" class="btn-logout">🚪 退出</a>
            </div>
        </div>

        <!-- 上传区域 -->
        <div class="upload-section">
            <h3>📤 上传新图片</h3>
            <form method="post" action="/admin/upload" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/*" required>
                <button type="submit" class="btn-upload">上传</button>
            </form>
            <div class="msg-success" th:if="${success}" th:text="${success}"></div>
            <div class="msg-error" th:if="${error}" th:text="${error}"></div>
        </div>

        <!-- 图片列表 -->
        <div class="gallery-grid" th:if="${images != null && !images.isEmpty()}">
            <div class="image-card" th:each="img : ${images}">
                <div class="img-wrapper">
                    <img th:src="'/images/' + ${img}" th:alt="${img}">
                </div>
                <div class="card-footer">
                    <span class="filename" th:text="${img}"></span>
                    <a class="btn-delete" th:href="'/admin/delete/' + ${img}"
                       onclick="return confirm('确定删除这张图片吗？')">删除</a>
                </div>
            </div>
        </div>

        <div class="empty" th:if="${images == null || images.isEmpty()}">
            <span>📭</span>
            还没有图片，上传一张吧！
        </div>

        <div class="tip">
            💡 <strong>提示：</strong> 上传的图片会保存在 
            <code>src/main/resources/static/images/</code> 文件夹中。
            删除图片会永久移除文件。
        </div>

    </div>
</body>
</html>
