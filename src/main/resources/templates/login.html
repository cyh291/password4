<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员验证</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 48px 36px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }
        .icon {
            font-size: 64px;
            margin-bottom: 12px;
        }
        h2 {
            color: #f1f5f9;
            font-weight: 500;
            font-size: 24px;
            margin-bottom: 4px;
        }
        .sub {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 28px;
        }
        input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 60px;
            background: rgba(15, 23, 42, 0.8);
            color: #f8fafc;
            font-size: 18px;
            letter-spacing: 4px;
            outline: 2px solid transparent;
            transition: 0.2s;
            text-align: center;
        }
        input:focus {
            outline: 2px solid #818cf8;
        }
        input::placeholder {
            color: #64748b;
            letter-spacing: 2px;
            font-size: 15px;
        }
        .btn-primary {
            width: 100%;
            margin-top: 16px;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #818cf8, #6366f1);
            color: #fff;
            font-size: 19px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary:hover {
            transform: scale(1.02);
        }
        .error {
            color: #f87171;
            font-size: 14px;
            margin-top: 14px;
            min-height: 24px;
        }
        .hint {
            color: #475569;
            font-size: 12px;
            margin-top: 18px;
        }
        .hint code {
            background: #1e293b;
            padding: 2px 10px;
            border-radius: 6px;
            color: #818cf8;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔐</div>
        <h2>管理员验证</h2>
        <p class="sub">请输入管理员密码进入</p>

        <form method="post" action="/login">
            <input type="password" name="password" placeholder="请输入密码" autofocus required>
            <button type="submit" class="btn-primary">🔓 解锁</button>
        </form>

        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="hint">💡 默认密码：<code>1234</code></div>
    </div>
</body>
</html>
